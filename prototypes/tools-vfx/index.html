<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Physics TD · pixelfx water lab</title>
<style>
body{margin:0;background:#0f1a28;color:#edf5ff;font:16px system-ui,sans-serif}
main{max-width:700px;margin:auto;padding:20px}
canvas{width:100%;max-width:640px;aspect-ratio:16/9;background:#142b3e;image-rendering:pixelated;border:1px solid #52718b;display:block}
button{min-height:48px;padding:12px 18px;margin:6px 6px 6px 0;background:#254d69;color:white;border:1px solid #8ac0de;border-radius:8px;font:inherit}
button:focus-visible{outline:3px solid #ffd76d}
#status{min-height:2em}
</style>
</head>
<body>
<main>
<h1>Physics TD · 물 이펙트 실험실</h1>
<p>pixelfx 기반의 독립형 시각 실험입니다. 본편 게임에는 연결되지 않았습니다.</p>
<canvas id="stage" width="320" height="180" aria-label="물결 픽셀 효과 미리보기"></canvas>
<p><button id="ripples" type="button">물결 시작</button><button id="pause" type="button" aria-pressed="false">일시정지</button></p>
<p id="status" role="status">효과 라이브러리 로딩 중…</p>
<p id="metrics" aria-live="off">성능 측정 대기</p>
<small>외부 CDN이 필요합니다. 성능·모바일·접근성 검증 후 로컬 번들에 통합해야 합니다.</small>
</main>
<script type="module">
const canvas = document.querySelector('#stage');
const ctx = canvas.getContext('2d', { alpha: false });
const status = document.querySelector('#status');
const pauseButton = document.querySelector('#pause');
const metrics = document.querySelector('#metrics');
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let paused = reducedMotion;
let fx = null;
let api = null;
let ripple = null;
let frame = null;
let image = null;
let previous = 0;
let raf = 0;
let samples = 0;
let totalRenderMs = 0;
let maxRenderMs = 0;
let lastMetricUpdate = 0;
const FRAME_INTERVAL_MS = 1000 / 30;
function message(text) { status.textContent = text; }
function drawBackground() {
  ctx.fillStyle = '#142b3e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#285776';
  ctx.fillRect(0, 110, canvas.width, 70);
  ctx.fillStyle = '#64b5d5';
  ctx.fillRect(0, 109, canvas.width, 2);
}
function tick(now) {
  raf = 0;
  if (paused || document.hidden) return;
  if (previous && now - previous < FRAME_INTERVAL_MS) {
    raf = requestAnimationFrame(tick);
    return;
  }
  const dt = Math.min((now - (previous || now)) / 1000, 0.05);
  previous = now;
  const renderStart = performance.now();
  if (fx && api && frame && image) {
    fx.update(dt);
    api.clearFrame(frame);
    fx.draw(frame, 'back');
    fx.draw(frame, 'front');
    api.composite(frame, image.data, 0x3e2b14); // packed RGB: #142b3e
    ctx.putImageData(image, 0, 0);
  } else drawBackground();
  const renderMs = performance.now() - renderStart;
  totalRenderMs += renderMs;
  maxRenderMs = Math.max(maxRenderMs, renderMs);
  samples++;
  if (now - lastMetricUpdate >= 2000) {
    metrics.textContent = '목표 30 FPS · 평균 렌더 ' + (totalRenderMs / samples).toFixed(1) + 'ms · 최대 ' + maxRenderMs.toFixed(1) + 'ms (' + samples + '프레임)';
    samples = 0; totalRenderMs = 0; maxRenderMs = 0; lastMetricUpdate = now;
  }
  raf = requestAnimationFrame(tick);
}
function resume() {
  if (paused || document.hidden || raf) return;
  previous = 0;
  raf = requestAnimationFrame(tick);
}
function stop() { if (raf) cancelAnimationFrame(raf); raf = 0; previous = 0; }
pauseButton.setAttribute('aria-pressed', String(paused));
pauseButton.textContent = paused ? '재생' : '일시정지';
drawBackground();
document.querySelector('#ripples').addEventListener('click', () => {
  if (!api || !ripple) { message('라이브러리 로딩 중입니다.'); return; }
  fx = api.createFx(ripple, { x: 160, y: 113, seed: 3 });
  message('물결 효과 생성 완료');
  if (!paused) resume();
});
pauseButton.addEventListener('click', () => {
  paused = !paused;
  pauseButton.setAttribute('aria-pressed', String(paused));
  pauseButton.textContent = paused ? '재생' : '일시정지';
  if (paused) stop(); else resume();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); else resume(); });
try {
  const [core, effect] = await Promise.all([
    import('https://cdn.jsdelivr.net/gh/patch-gg/pixelfx@main/src/core/index.js'),
    import('https://cdn.jsdelivr.net/gh/patch-gg/pixelfx@main/src/fx/water/ripples.js'),
  ]);
  api = core;
  ripple = effect;
  frame = api.createFrame(320, 180);
  image = ctx.createImageData(320, 180);
  message('준비 완료. 물결 시작 버튼을 누르세요.');
  resume();
} catch (error) {
  message('pixelfx 로드 실패. CDN 주소·네트워크를 확인하세요.');
  console.error(error);
}
</script>
</body>
</html>
