name: Physics TD Pages (web only)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: physics-td-pages
  cancel-in-progress: false
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check engine.js
          node --check src.js
          npm test
          npm run build
          npm run build:v2
          node bots/run.ts
          for f in $(find dist-v2 -name '*.js'); do node --check "$f"; done
          mkdir -p dist/v2
          cp -r dist-v2/. dist/v2/
          cp dist/v2/v2.html dist/v2/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
