name: Game tools audit
on:
  push:
    branches:
      - chore/game-tools-integration-20261120
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - name: Run isolated audit tests
        run: node --test tests/audit-game-tools.test.mjs tests/prototype-syntax.test.mjs
      - name: Install locked dependencies
        run: npm ci
      - name: Build all game targets and optional labs
        run: npm run build
      - name: Check optional labs are packaged
        run: |
          test -s dist/tools-sfx/index.html
          test -s dist/tools-vfx/index.html
      - name: Install Chromium browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser smoke for optional labs
        run: node tests/e2e/tool-labs.e2e.mjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tool-labs-browser-evidence
          path: production/qa/evidence/tool-labs/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Print optional tool status
        run: node scripts/audit-game-tools.mjs --json
