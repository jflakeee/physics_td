name: Game tools audit
on:
  push:
    branches:
      - chore/game-tools-integration-20261120
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - name: Run isolated audit tests
        run: node --test tests/audit-game-tools.test.mjs tests/prototype-syntax.test.mjs
      - name: Install locked dependencies
        run: npm ci
      - name: Build all game targets and optional labs
        run: npm run build
      - name: Check optional labs are packaged
        run: |
          test -s dist/tools-sfx/index.html
          test -s dist/tools-vfx/index.html
      - name: Print optional tool status
        run: node scripts/audit-game-tools.mjs --json
