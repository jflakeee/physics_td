<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Physics TD</title><style>*{box-sizing:border-box}body{margin:0;background:#101b2b;color:#edf5ff;font-family:system-ui}main{max-width:960px;margin:auto;padding:12px}h1{font-size:1.5rem}.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}canvas{display:block;width:100%;height:auto;touch-action:none;background:#192d45;border:1px solid #607d99;border-radius:8px}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}button{min-height:48px;border:1px solid #718da8;background:#28445f;color:white;border-radius:8px;font-size:1rem}button.selected{background:#147b89}button:disabled{opacity:.45}#message{min-height:1.5em;color:#b7d6f3}small{color:#b3c6d9}.history{overflow-x:auto;margin-top:14px}.history table{width:100%;border-collapse:collapse;text-align:center}.history th,.history td{padding:8px;border-bottom:1px solid #466078}.damage-graph{height:100px;display:flex;align-items:flex-end;gap:12px;padding:8px;background:#182c42;border-radius:8px}.damage-bar{min-width:30px;max-width:64px;flex:1;background:#dc8d65;border-radius:4px 4px 0 0;text-align:center;color:#101b2b;font-weight:bold;font-size:12px}</style></head><body><main><h1>🌊 PHYSICS TD</h1><div class="hud"><strong id="stats"></strong><small>물과 얼음을 이용한 5웨이브 타워 디펜스</small></div><canvas id="game" width="800" height="480" aria-label="게임 보드"></canvas><div class="controls"><button data-tool="wall">🧱 방벽 $15</button><button data-tool="tower">🎯 포탑 $35</button><button data-tool="cooler">❄️ 냉각탑 $45</button><button id="wave">▶ 웨이브</button><button id="pause">⏸ 일시정지</button><button id="perf">📊 성능 보기</button><button id="path">🧭 경로 보기</button><button id="retry" disabled>↩ 웨이브 재도전</button><button id="reset">↻ 초기화</button></div><section class="history" aria-label="웨이브별 전투 기록"><h2>웨이브별 전투 기록</h2><table><thead><tr><th>웨이브</th><th>처치</th><th>도달</th><th>차단</th><th>피해</th></tr></thead><tbody id="wave-history"></tbody></table><h3>웨이브별 기지 피해</h3><div id="damage-graph" class="damage-graph" role="group" aria-label="웨이브별 기지 피해 그래프"></div></section><p id="campaign-report" aria-live="off"></p><p id="attempt-report" aria-live="off"></p><p id="wave-report" aria-live="off"></p><p id="wave-info" aria-live="off"></p><p id="message" role="status"></p><small>터치/클릭으로 설치하세요. 방벽은 빈 공간에, 타워는 지면 바로 위에 설치합니다.</small></main><script type="module" src="./src.js"></script></body></html>
