<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Physics TD</title><style>*{box-sizing:border-box}body{margin:0;background:#101b2b;color:#edf5ff;font-family:system-ui}main{max-width:960px;margin:auto;padding:12px}h1{font-size:1.5rem}.hud{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;background:#20354b;border:1px solid #405d77;border-radius:8px;padding:10px;margin-bottom:8px}.hud strong{font-variant-numeric:tabular-nums;font-size:1.05rem}.fine-adjust{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin:6px 0 10px}.fine-adjust button{min-width:48px;min-height:44px}.fine-adjust button:disabled{opacity:.35}.fine-adjust #confirm-placement{background:#166f60;border-color:#43b99c;font-weight:700}.fine-adjust #cancel-placement{background:#4a3446}@media(max-width:520px){.fine-adjust{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.fine-adjust button{min-width:0;width:100%;font-size:1rem}.fine-adjust #confirm-placement,.fine-adjust #cancel-placement{grid-column:span 2}.fine-adjust #confirm-placement{min-height:50px}} #placement-hint{min-height:1.5em;font-size:.9rem;color:#b3c6d9;margin:5px 0}#placement-hint[data-valid=yes]{color:#80efbb}#placement-hint[data-valid=no]{color:#ffadad}canvas{display:block;width:100%;height:auto;touch-action:none;background:#192d45;border:1px solid #607d99;border-radius:8px}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}button{min-height:48px;border:1px solid #718da8;background:#28445f;color:white;border-radius:8px;font-size:1rem}button.selected{background:#147b89}button:disabled{opacity:.45}#message{min-height:1.5em;color:#b7d6f3}small{color:#b3c6d9}.history{overflow-x:auto;margin-top:14px}.history summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700;color:#cbe8ff}.history summary:focus-visible{outline:2px
