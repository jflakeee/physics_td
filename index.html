<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Physics TD</title><style>*{box-sizing:border-box}body{margin:0;background:#101b2b;color:#edf5ff;font-family:system-ui}main{max-width:960px;margin:auto;padding:12px}h1{font-size:1.5rem}.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}canvas{display:block;width:100%;height:auto;touch-action:none;background:#192d45;border:1px solid #607d99;border-radius:8px}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}button{min-height:48px;border:1px solid #718da8;background:#28445f;color:white;border-radius:8px;font-size:1rem}button.selected{background:#147b89}button:disabled{opacity:.45}#message{min-height:1.5em;color:#b7d6f3}small{color:#b3c6d9}</style></head><body><main><h1>🌊 PHYSICS TD</h1><div class="hud"><strong id="stats"></strong><small>물과 얼음을 이용한 5웨이브 타워 디펜스</small></div><canvas id="game" width="800" height="480" aria-label="게임 보드"></canvas><div class="controls"><button data-tool="wall">🧱 방벽 $15</button><button data-tool="tower">🎯 포탑 $35</button><button data-tool="cooler">❄️ 냉각탑 $45</button><button id="wave">▶ 웨이브</button><button id="pause">⏸ 일시정지</button><button id="path">🧭 경로 보기</button><button id="retry" disabled>↩ 웨이브 재도전</button><button id="reset">↻ 초기화</button></div><p id="wave-info" aria-live="off"></p><p id="message" role="status"></p><small>터치/클릭으로 설치하세요. 방벽은 빈 공간에, 타워는 지면 바로 위에 설치합니다.</small></main><script type="module" src="./src.js"></script></body></html>
