<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f1d27">
<title>Physics TD v2</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0f1d27;color:#eaf2f8;overscroll-behavior:none;-webkit-text-size-adjust:100%;
  font:14px/1.2 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
#app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app.land{grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
#app.land .board-wrap{grid-column:1;grid-row:1/3}
#app.land .hud{grid-column:2;grid-row:1}
#app.land .skills{grid-column:2;grid-row:2;display:grid;grid-template-columns:1fr 1fr;align-content:start;justify-content:stretch}
#app.land .skill{width:auto}
#app.short .hide-short{display:none}
.board-wrap{position:relative;overflow:hidden;min-height:0}
#board{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;touch-action:none;border-radius:4px}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:2px 6px 0}
.stats{display:flex;align-items:center;gap:8px;flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden}
.stat .ic{margin-right:2px}
.hud-btn{width:48px;height:48px;font-size:18px}
.gauge{flex-basis:100%;display:flex;align-items:center;gap:6px;height:16px}
.gauge .ic{font-size:12px}
.track{flex:1;height:6px;background:#29404f;border-radius:3px;overflow:hidden}
.fill{height:100%;width:0;background:#4fc3f7}
.gauge.danger .fill{background:repeating-linear-gradient(45deg,#ff5a4f 0 4px,#b3261e 4px 8px)}
.skills{display:flex;justify-content:center;align-items:flex-end;gap:6px;padding:6px}
button{font:inherit;color:inherit;background:#22394a;border:2px solid #3b5a70;border-radius:10px;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid #ffd54f;outline-offset:1px}
.skill{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;overflow:hidden}
.s48{width:48px;height:48px;min-height:48px}
.s56{width:56px;height:56px;min-height:56px}
.skill .ic{font-size:20px;line-height:1}
.skill .nm{font-size:10px;line-height:1.1;white-space:nowrap}
.skill .hint{position:absolute;top:1px;right:3px;font-size:8px;color:#d9c2ff}
.skill[aria-pressed=true]{background:#ffd54f;color:#1a1a1a;border-color:#fff}
.skill:disabled{opacity:.4;cursor:default}
.skill.ult{border-color:#a77bf0}
.toasts{position:absolute;top:6px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;width:max-content;max-width:92%}
.toast{background:rgba(0,0,0,.78);padding:6px 10px;border-radius:8px;font-size:13px;text-align:center}
.start{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);min-height:56px;padding:0 18px;white-space:nowrap;background:#2e7d32;border-color:#81c784;font-weight:700}
.start[hidden]{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="main.js"></script>
</body>
</html>
